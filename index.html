<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Angebotsjäger – Einkaufsliste</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#12201a;--mute:#6a7d72;--line:#e5ece8;--accent:#15a24a;--accent-d:#0f7f39;--accent-ink:#fff;--chip:#e7f6ec;--danger:#d92d20;--warn:#fff3d4;--shadow:0 1px 2px #0a1f1408,0 4px 14px #0a1f140d;
--lidl-bg:#e3eeff;--lidl:#0a4aa6;--rewe-bg:#fde7ea;--rewe:#b3061c;--aldi-bg:#fff0dc;--aldi:#a8520a;--oth-bg:#eef1ef;--oth:#4b5a52}
@media (prefers-color-scheme:dark){:root{--bg:#0c1310;--card:#151e19;--ink:#e9f2ed;--mute:#8da396;--line:#24312a;--accent:#2fd068;--accent-d:#22b457;--accent-ink:#04200f;--chip:#1b2d22;--danger:#ff7b72;--warn:#3a3217;--shadow:0 1px 2px #0006;
--lidl-bg:#16284a;--lidl:#8fb7ff;--rewe-bg:#3a1a1f;--rewe:#ff9aa6;--aldi-bg:#3a2713;--aldi:#ffbf80;--oth-bg:#222d27;--oth:#a9b9af}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(104px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;margin:6px 0 4px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,var(--accent),var(--accent-d));display:grid;place-items:center;font-size:22px;box-shadow:0 4px 12px #15a24a40;flex:none}
header h1{flex:1;font-size:26px;margin:0;letter-spacing:-.03em;line-height:1.1}
header h1 small{display:block;font-size:13px;font-weight:500;color:var(--mute);letter-spacing:0;margin-top:3px}
.icon-btn{border:0;background:var(--card);color:var(--ink);width:44px;height:44px;border-radius:14px;font-size:20px;box-shadow:var(--shadow);flex:none}
.prog{height:6px;border-radius:99px;background:var(--line);margin:14px 0 16px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#7ee2a0);border-radius:99px;transition:width .35s ease}
.addbox{position:relative}
.addrow{display:flex;gap:10px}
.addrow input,.searchrow input{flex:1;min-width:0;height:54px;border-radius:18px;border:1.5px solid transparent;background:var(--card);color:var(--ink);padding:0 18px;font-size:17px;outline:none;width:100%;box-shadow:var(--shadow);transition:border-color .15s}
.addrow input:focus,.searchrow input:focus{border-color:var(--accent)}
.addrow button{height:54px;width:54px;border:0;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-size:28px;font-weight:600;box-shadow:0 4px 12px #15a24a40;flex:none}
.addrow button:active{transform:scale(.94)}
.sugg{position:absolute;left:0;right:64px;top:60px;background:var(--card);border-radius:18px;box-shadow:0 12px 36px #0004;z-index:5;overflow:hidden;display:none}
.sugg button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;color:var(--ink);text-align:left;padding:13px 18px;font-size:16px;border-bottom:1px solid var(--line)}
.sugg button:last-child{border:0}
.sugg button:active,.sugg button.on{background:var(--chip)}
.sugg button.fix{background:var(--warn)}
.sugg em{margin-left:auto;font-style:normal;color:var(--mute);font-size:13px}
.sec{margin:22px 2px 8px;font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--card);color:var(--ink);padding:9px 14px;border-radius:999px;font-size:15px;box-shadow:var(--shadow)}
.chip:active{transform:scale(.95)}
.chip b{color:var(--accent);margin-right:5px}
.group{background:var(--card);border-radius:22px;margin:14px 0;box-shadow:var(--shadow);overflow:hidden}
.group h3{display:flex;align-items:center;gap:10px;margin:0;padding:14px 16px 8px;font-size:13px;color:var(--mute);font-weight:700;letter-spacing:.02em}
.group h3 span{width:30px;height:30px;border-radius:10px;background:var(--chip);display:grid;place-items:center;font-size:16px}
.group h3 em{margin-left:auto;font-style:normal;font-weight:600;font-size:12px;background:var(--bg);border-radius:99px;padding:2px 9px}
.item{display:flex;align-items:center;gap:12px;padding:10px 6px 10px 16px;min-height:58px;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.box{width:28px;height:28px;border-radius:50%;border:2px solid #b6c6bc;background:none;flex:none;display:grid;place-items:center;color:var(--accent-ink);font-size:15px;font-weight:800;padding:0;transition:all .15s}
.item.done .box{background:var(--accent);border-color:var(--accent)}
.item .main{flex:1;min-width:0;padding:2px 0}
.item .name{font-size:17px;font-weight:600;word-break:break-word;line-height:1.25}
.item.done .name{color:var(--mute);text-decoration:line-through;font-weight:500}
.item.done .deal,.item.done .price{display:none}
.deal{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px;font-size:12.5px;color:var(--mute)}
.item .prod{margin-top:3px;font-size:12.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.done .prod{display:none}
#popupOk,.btn:focus{outline:none}
.btn:focus-visible{outline:2px solid var(--accent-d);outline-offset:2px}
#popupOk:focus-visible{outline:none}
.mk{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:99px;letter-spacing:.01em;white-space:nowrap}
.mk-lidl{background:var(--lidl-bg);color:var(--lidl)}.mk-rewe{background:var(--rewe-bg);color:var(--rewe)}.mk-aldi{background:var(--aldi-bg);color:var(--aldi)}.mk-oth{background:var(--oth-bg);color:var(--oth)}
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--mute);white-space:nowrap}
.tag.later{background:var(--warn);color:#946200}
.tag.best{background:var(--accent);color:var(--accent-ink)}
.price{text-align:right;flex:none;padding-left:4px}
.price b{display:block;font-size:18px;font-weight:800;color:var(--accent-d);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
@media (prefers-color-scheme:dark){.price b{color:var(--accent)}.tag.later{color:#ffd37a}}
.price small{display:block;font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.item .del{border:0;background:none;color:#aab9b0;width:40px;height:44px;font-size:22px;flex:none}
.empty{text-align:center;color:var(--mute);padding:48px 16px}
.empty div{font-size:56px;margin-bottom:6px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.foot{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;border:0;background:var(--card);color:var(--ink);height:48px;border-radius:16px;font-size:15px;font-weight:600;box-shadow:var(--shadow)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 12px #15a24a40}
.btn.danger{color:var(--danger)}
.btn:active{transform:scale(.98)}
.banner{background:var(--warn);border-radius:16px;padding:11px 14px;margin:0 0 14px;font-size:14px}
.deals{background:var(--card);border-radius:22px;padding:4px 16px;box-shadow:var(--shadow);margin:12px 0}
.deal-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.deal-row:first-child{border-top:0}
.deal-row .pn{font-weight:600;margin-top:5px;line-height:1.25}
.deal-row .m{color:var(--mute);font-size:12.5px;margin-top:1px}
.deal-row.best .pn{font-size:17px}
.deal-row.best .price b{font-size:21px}
.hint{color:var(--mute);font-size:13px}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:var(--card);border-radius:24px;display:flex;padding:6px;gap:6px;z-index:10;box-shadow:0 8px 30px #0003}
.tabs button{flex:1;border:0;background:none;color:var(--mute);padding:9px 0 7px;font-size:12px;font-weight:700;border-radius:18px;transition:all .15s}
.tabs button span{display:block;font-size:21px;margin-bottom:1px}
.tabs button.on{background:var(--chip);color:var(--accent-d)}
@media (prefers-color-scheme:dark){.tabs button.on{color:var(--accent)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:#14231a;color:#fff;padding:11px 16px;border-radius:16px;display:none;gap:14px;align-items:center;z-index:20;max-width:92vw;box-shadow:0 8px 28px #0006}
.toast button{border:0;background:none;color:#7ee2a0;font-weight:700;font-size:15px}
dialog{border:0;border-radius:26px;background:var(--card);color:var(--ink);width:min(92vw,440px);padding:22px;max-height:88vh;box-shadow:0 20px 60px #0005}
dialog::backdrop{background:#0008;backdrop-filter:blur(3px)}
dialog h2{margin:0 0 10px;font-size:21px;letter-spacing:-.02em}
dialog label{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px;font-weight:600}
dialog p{color:var(--mute);font-size:13px}
textarea{width:100%;height:84px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;font:12px ui-monospace,Consolas,monospace}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🛒</div>
    <h1 id="title">Einkaufsliste<small id="sub"></small></h1>
    <button class="icon-btn" id="cfg" aria-label="Einstellungen">⚙️</button>
  </header>
  <div class="prog" id="progWrap"><i id="prog"></i></div>
  <div id="banner"></div>

  <section id="viewList">
    <div class="addbox">
      <form class="addrow" id="form" autocomplete="off">
        <input id="inp" type="text" placeholder="Was brauchst du?" enterkeyhint="done" autocapitalize="sentences" autocorrect="off" spellcheck="false">
        <button type="submit" aria-label="Hinzufügen">+</button>
      </form>
      <div class="sugg" id="sugg"></div>
    </div>
    <div id="quick"></div>
    <div id="list"></div>
    <div class="foot" id="foot" hidden>
      <button class="btn" id="clearDone">✓ Erledigte entfernen</button>
      <button class="btn danger" id="clearAll">Alles leeren</button>
    </div>
  </section>

  <section id="viewDeals" hidden>
    <div class="searchrow"><input id="q" type="search" placeholder="Angebot suchen, z. B. Hackfleisch" autocomplete="off" autocorrect="off" spellcheck="false"></div>
    <div id="dealChips"></div>
    <div id="dealRes"></div>
  </section>
</div>

<nav class="tabs">
  <button id="tabList" class="on"><span>🛒</span>Liste</button>
  <button id="tabDeals"><span>🏷️</span>Angebote</button>
</nav>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn">Rückgängig</button></div>

<dialog id="popup">
  <h2>🔔 Bestpreise für deine Liste</h2>
  <div id="popupBody"></div>
  <div class="foot"><button class="btn primary" id="popupOk">Super, danke</button></div>
</dialog>

<dialog id="dlg">
  <h2>Einstellungen</h2>
  <label>Postleitzahl (Umkreis <span id="km">5</span> km)</label>
  <p id="plzInfo" style="margin:0"></p>
  <p>Die PLZ steht in <code>config.json</code> im Repository – dort ändern, nicht hier. Auf dem Handy wird keine Adresse gespeichert.</p>

  <label>Benachrichtigung auch bei geschlossener App</label>
  <p style="margin:0 0 8px">Auf dem iPhone muss die App vorher über „Teilen → Zum Home-Bildschirm" installiert sein.</p>
  <button class="btn primary" id="pushBtn" style="width:100%">Push-Nachrichten aktivieren</button>
  <div id="pushOut" hidden>
    <label>1) Für GitHub-Secret PUSH_SUBSCRIPTIONS (diesen Eintrag zur Liste ergänzen)</label>
    <textarea id="subTxt" readonly></textarea>
    <button class="btn" data-copy="subTxt" style="width:100%;margin-top:6px">Kopieren</button>
    <label>2) Für GitHub-Secret WATCHLIST (Produkte deiner aktuellen Liste)</label>
    <textarea id="wlTxt" readonly></textarea>
    <button class="btn" data-copy="wlTxt" style="width:100%;margin-top:6px">Kopieren</button>
  </div>
  <p id="pushMsg"></p>
  <div class="foot"><button class="btn" id="dlgClose">Schließen</button></div>
</dialog>

<script src="config.js"></script>
<script src="vocab.js"></script>
<script src="logic.js"></script>
<script>
// ---------- Speicher (localStorage mit Fallback) ----------
const mem = {};
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : (k in mem ? mem[k] : d); }catch(e){ return k in mem ? mem[k] : d; } },
  set(k, v){ mem[k] = v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let list = store.get('aj_list', []);   // {id,name,cat,done}
let hist = store.get('aj_hist', {});   // name(lowercase) -> {name,cat,count,last}
let D = {angebote: []};                // Angebote vom Server (data/offers.json)
let vocab = AJ.makeVocab(window.VOCAB);

// ---------- Kategorien ----------
const CATS = [
  ['Obst & Gemüse','🥕',/apfel|äpfel|birne|banane|orange|zitrone|tomate|gurke|paprika|zwiebel|knoblauch|kartoffel|salat|karotte|möhre|brokkoli|pilz|champignon|beere|erdbeere|trauben|avocado|zucchini|lauch|gemüse|obst|kürbis|spinat|kohl/i],
  ['Fleisch & Fisch','🥩',/hack|gehackt|fleisch|hähnchen|hühn|pute|schnitzel|steak|wurst|schinken|speck|salami|lachs|fisch|thunfisch|garnele|bratwurst|würstchen|aufschnitt|filet/i],
  ['Milch & Käse','🧀',/milch|käse|joghurt|quark|butter|sahne|\bei\b|eier|mozzarella|gouda|frischkäse|skyr|margarine|schmand/i],
  ['Brot & Backen','🍞',/brot|brötchen|toast|mehl|zucker|hefe|backpulver|kuchen|croissant|müsli|haferflocken|cornflakes|semmel/i],
  ['Nudeln, Reis & Konserven','🍝',/nudel|pasta|spaghetti|reis|dose|konserve|passierte|ketchup|soße|sauce|öl\b|essig|gewürz|salz|pfeffer|linsen|bohnen|mais|suppe|brühe|nutella|marmelade|honig/i],
  ['Getränke','🥤',/wasser|saft|cola|limo|bier|wein|sekt|kaffee|tee\b|sprudel|schorle|getränk|energy/i],
  ['Tiefkühl','🧊',/tiefkühl|tk-|pizza|pommes|eis\b|eiscreme|fischstäbchen|gefroren/i],
  ['Süßes & Snacks','🍫',/schoko|chips|kekse|gummi|bonbon|nüsse|riegel|snack|süß|keks|popcorn/i],
  ['Haushalt & Drogerie','🧻',/klopapier|toilettenpapier|küchenrolle|spülmittel|waschmittel|müllbeutel|müllsack|zahnpasta|shampoo|duschgel|seife|tempo|taschentuch|reiniger|schwamm|deo|windel|spüli/i]
];
const OTHER = ['Sonstiges','🛒'];
const catOf = n => (CATS.find(c => c[2].test(n)) || OTHER);
const catInfo = name => CATS.find(c => c[0]===name) || OTHER;

// ---------- Hilfsfunktionen ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => s.trim().replace(/\s+/g,' ');
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const eur = n => Number(n).toFixed(2).replace('.',',') + ' €';
const dm = iso => iso ? iso.split('-').reverse().slice(0,2).join('.') + '.' : '';
const save = () => { store.set('aj_list', list); store.set('aj_hist', hist); };
const onList = n => list.some(i => i.name.toLowerCase() === n.toLowerCase());
const unitTxt = o => o._u ? ` · ${eur(o._u.v)}/${o._u.u === 'Stk' ? 'Stück' : o._u.u}` : '';
const when = o => o._later ? `ab ${dm(o.von)}` : `bis ${dm(o.bis)}`;
const mkCls = n => { n = String(n).toLowerCase(); return n.includes('lidl') ? 'mk-lidl' : n.includes('rewe') ? 'mk-rewe' : n.includes('aldi') ? 'mk-aldi' : 'mk-oth'; };
const mkName = n => { n = String(n); return /rewe/i.test(n) ? 'REWE' : /aldi/i.test(n) ? 'ALDI SÜD' : /lidl/i.test(n) ? 'Lidl' : n; };
const mkChip = n => `<span class="mk ${mkCls(n)}">${esc(mkName(n))}</span>`;
const needApp = o => /HINWEIS:\s*MIT/i.test(o.beschreibung || '');
const packTxt = o => (o.beschreibung || '').replace(/HINWEIS:\s*MIT\s+(LIDL PLUS\s+)?APP(\s+[\d.,]+\s*€\s*REWE BONUS)?/i, '').replace(/\s+/g, ' ').trim();
const prodTxt = o => esc(o.produkt) + (packTxt(o) ? ' · ' + esc(packTxt(o)) : '');
const appTag = o => needApp(o) ? '<span class="tag">📱 mit App</span>' : '';
const unitOnly = o => o._u ? `${eur(o._u.v)}/${o._u.u === 'Stk' ? 'Stück' : o._u.u}` : '';
const whenTag = o => o._later ? `<span class="tag later">ab ${dm(o.von)}</span>` : `<span class="tag">bis ${dm(o.bis)}</span>`;

// ---------- Hinzufügen mit Rechtschreibkorrektur ----------
function learnVocab(){ // Wortschatz = Grundliste + eigener Verlauf + Produktnamen aus den Angeboten
  const words = [...window.VOCAB];
  Object.values(hist).forEach(h => words.push(...h.name.split(' ')));
  (D.angebote||[]).forEach(o => words.push(...String(o.produkt||'').split(/[\s,\/]+/)));
  vocab = AJ.makeVocab(words.filter(w => /^[A-Za-zÄÖÜäöüß]{4,}$/.test(w)));
}
let lastAdd = null;
function addItem(raw, {noFix} = {}){
  let text = norm(raw); if(!text) return;
  const fix = noFix ? {text, changed:false} : AJ.correct(text, vocab);
  const name = cap(fix.text), key = name.toLowerCase();
  if(onList(name)){ flash(); return; }
  const known = hist[key];
  const cat = known ? known.cat : catOf(name)[0];
  const id = Date.now() + Math.random();
  list.push({id, name, cat, done:false});
  hist[key] = {name, cat, count:(known ? known.count : 0) + 1, last:Date.now()};
  save(); render();
  if(fix.changed){
    lastAdd = {id, original: cap(text), key};
    toast(`Korrigiert: ${cap(text)} → ${name}`, 'Rückgängig', undoFix);
  }
}
function undoFix(){
  if(!lastAdd) return;
  const it = list.find(i => i.id === lastAdd.id); if(!it) return;
  delete hist[it.name.toLowerCase()];
  it.name = lastAdd.original; it.cat = catOf(it.name)[0];
  hist[it.name.toLowerCase()] = {name: it.name, cat: it.cat, count: 1, last: Date.now()};
  lastAdd = null; save(); render();
}
function flash(){ const i=$('#inp'); i.style.borderColor='var(--danger)'; setTimeout(()=>i.style.borderColor='',500); }
let toastT;
function toast(msg, btn, fn){
  $('#toastMsg').textContent = msg; const b = $('#toastBtn'); b.textContent = btn; b.onclick = () => { fn(); $('#toast').style.display='none'; };
  $('#toast').style.display = 'flex'; clearTimeout(toastT); toastT = setTimeout(() => $('#toast').style.display='none', 6000);
}

// ---------- Vorschläge beim Tippen ----------
let sel = -1;
function suggestions(q){
  q = q.trim(); if(!q) return [];
  const out = [], ql = q.toLowerCase();
  const fix = AJ.correct(q, vocab);
  if(fix.changed) out.push({fix: true, name: cap(fix.text)});
  Object.values(hist)
    .filter(h => h.name.toLowerCase().includes(ql) && !onList(h.name))
    .sort((a,b) => (b.name.toLowerCase().startsWith(ql)) - (a.name.toLowerCase().startsWith(ql)) || b.count - a.count)
    .slice(0,5).forEach(h => out.push(h));
  return out;
}
function renderSugg(){
  const box = $('#sugg'), s = suggestions($('#inp').value);
  if(!s.length){ box.style.display='none'; box.innerHTML=''; sel=-1; return; }
  box.innerHTML = s.map((h,i) => h.fix
    ? `<button type="button" class="fix ${i===sel?'on':''}" data-n="${esc(h.name)}">✏️ Meintest du „${esc(h.name)}“?</button>`
    : `<button type="button" class="${i===sel?'on':''}" data-n="${esc(h.name)}">${catInfo(h.cat)[1]} ${esc(h.name)}<em>${h.count}× gekauft</em></button>`).join('');
  box.style.display = 'block';
}
$('#inp').addEventListener('input', () => { sel=-1; renderSugg(); });
$('#inp').addEventListener('keydown', e => {
  const btns = [...document.querySelectorAll('#sugg button')];
  if(e.key==='ArrowDown' && btns.length){ e.preventDefault(); sel=(sel+1)%btns.length; renderSugg(); }
  if(e.key==='ArrowUp' && btns.length){ e.preventDefault(); sel=(sel-1+btns.length)%btns.length; renderSugg(); }
  if(e.key==='Enter' && sel>=0 && btns[sel]){ e.preventDefault(); pick(btns[sel].dataset.n); }
  if(e.key==='Escape'){ $('#sugg').style.display='none'; }
});
$('#sugg').addEventListener('mousedown', e => e.preventDefault());
$('#sugg').addEventListener('click', e => { const b=e.target.closest('button'); if(b) pick(b.dataset.n); });
function pick(n){ addItem(n, {noFix:true}); $('#inp').value=''; renderSugg(); $('#inp').focus(); }
$('#form').addEventListener('submit', e => { e.preventDefault(); const v=$('#inp').value; if(!norm(v)) return; addItem(v); $('#inp').value=''; renderSugg(); });

// ---------- Angebote zur Liste ----------
const dealFor = name => AJ.offersFor(name, D.angebote || [])[0];
function listDeals(){ return list.filter(i => !i.done).map(i => ({item:i, o:dealFor(i.name)})).filter(x => x.o); }

function render(){
  const open = list.filter(i=>!i.done).length;
  const deals = listDeals().length;
  $('#prog').style.width = list.length ? Math.round((list.length-open)/list.length*100)+'%' : '0%'; $('#progWrap').style.display = list.length ? '' : 'none';
  $('#sub').textContent = list.length ? `${open} offen · ${list.length-open} erledigt` + (deals ? ` · ${deals} mit Angebot` : '') : '';

  const quick = Object.values(hist).filter(h => !onList(h.name)).sort((a,b)=>b.count-a.count || b.last-a.last).slice(0,8);
  $('#quick').innerHTML = quick.length ? `<div class="sec">Häufig gekauft</div><div class="chips">${quick.map(h=>`<button class="chip" data-n="${esc(h.name)}"><b>+</b>${esc(h.name)}</button>`).join('')}</div>` : '';

  if(!list.length){
    $('#list').innerHTML = `<div class="empty"><div>🛒</div><b>Deine Liste ist leer</b>Tippe oben etwas ein. Die App merkt sich, was du oft kaufst, und korrigiert Tippfehler.</div>`;
  } else {
    const order = [...CATS.map(c=>c[0]), OTHER[0]];
    $('#list').innerHTML = order.map(cn => {
      const items = list.filter(i=>i.cat===cn).sort((a,b)=>a.done-b.done);
      if(!items.length) return '';
      const left = items.filter(x => !x.done).length;
      return `<div class="group"><h3><span>${catInfo(cn)[1]}</span>${cn}<em>${left}/${items.length}</em></h3>${items.map(i=>{
        const o = i.done ? null : dealFor(i.name);
        const deal = o ? `<div class="deal">${mkChip(o.markt)}${whenTag(o)}${appTag(o)}</div><div class="prod">${prodTxt(o)}</div>` : '';
        const price = o ? `<div class="price" data-act="tog"><b>${eur(o.preis)}</b>${o._u ? `<small>${unitOnly(o)}</small>` : ''}</div>` : '';
        return `
        <div class="item ${i.done?'done':''}" data-id="${i.id}">
          <button class="box" data-act="tog" aria-label="abhaken">${i.done?'✓':''}</button>
          <div class="main" data-act="tog"><div class="name">${esc(i.name)}</div>${deal}</div>
          ${price}
          <button class="del" data-act="del" aria-label="entfernen">×</button>
        </div>`}).join('')}</div>`;
    }).join('');
  }
  $('#foot').hidden = !list.length;
}
$('#quick').addEventListener('click', e => { const b=e.target.closest('.chip'); if(b) addItem(b.dataset.n, {noFix:true}); });
$('#list').addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if(!a) return;
  const id = Number(a.closest('.item').dataset.id), it = list.find(i=>i.id===id); if(!it) return;
  if(a.dataset.act==='tog') it.done = !it.done; else list = list.filter(i=>i.id!==id);
  save(); render();
});
$('#clearDone').onclick = () => { list = list.filter(i=>!i.done); save(); render(); };
$('#clearAll').onclick = () => { if(list.length && confirm('Ganze Liste leeren? Der Verlauf bleibt erhalten.')){ list=[]; save(); render(); } };

// ---------- Tab „Angebote“ ----------
function renderDeals(){
  const q = $('#q').value.trim();
  const terms = [...new Set((D.angebote||[]).map(o => o.suche))].slice(0,14);
  $('#dealChips').innerHTML = terms.length ? `<div class="chips" style="margin-top:12px">${terms.map(t=>`<button class="chip" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>` : '';
  if(!q){ $('#dealRes').innerHTML = `<p class="hint" style="margin-top:14px">Tippe ein Produkt ein – alle Märkte im Umkreis werden nach Preis (pro kg/l, wenn bekannt) verglichen.</p>`; return; }
  const checked = AJ.correct(q, vocab);
  const hits = AJ.offersFor(checked.text, D.angebote || []);
  const note = checked.changed ? `<p class="hint">Gezeigt für „${esc(checked.text)}“ (Tippfehler korrigiert)</p>` : '';
  if(!hits.length){ $('#dealRes').innerHTML = note + `<div class="deals"><p>Nichts gefunden. Das Produkt wird vielleicht noch nicht abgefragt – setze es auf die Einkaufsliste und trage die Liste als WATCHLIST ein (Einstellungen).</p></div>`; return; }
  $('#dealRes').innerHTML = note + `<div class="deals">${hits.map((o,i)=>`<div class="deal-row ${i?'':'best'}"><div>${mkChip(o.markt)} ${i?'':'<span class="tag best">Bestpreis</span>'}${appTag(o)}<div class="pn">${esc(o.produkt)}</div><div class="m">${when(o)}${packTxt(o) ? ' · ' + esc(packTxt(o)) : ''}</div></div><div class="price"><b>${eur(o.preis)}</b>${o._u?`<small>${unitOnly(o)}</small>`:''}</div></div>`).join('')}</div>`;
}
$('#q').addEventListener('input', renderDeals);
$('#dealChips').addEventListener('click', e => { const b=e.target.closest('.chip'); if(b){ $('#q').value=b.dataset.t; renderDeals(); } });

function show(tab){
  $('#viewList').hidden = tab !== 'list'; $('#viewDeals').hidden = tab !== 'deals';
  $('#tabList').classList.toggle('on', tab==='list'); $('#tabDeals').classList.toggle('on', tab==='deals');
  $('#title').firstChild.textContent = tab==='list' ? 'Einkaufsliste' : 'Angebote';
  if(tab==='deals') renderDeals();
}
$('#tabList').onclick = () => show('list'); $('#tabDeals').onclick = () => show('deals');

// ---------- Popup + Benachrichtigung bei Bestpreisen ----------
async function announceDeals(){
  const ds = listDeals(); if(!ds.length || D.demo) return;
  const sig = (D.stand||'') + '|' + ds.map(x => x.item.name + x.o.markt + x.o.preis).join(',');
  if(store.get('aj_seen','') === sig) return;
  store.set('aj_seen', sig);
  const lines = ds.map(x => `${x.item.name}: ${x.o.markt} ${eur(x.o.preis)}`);
  $('#popupBody').innerHTML = `<div class="deals" style="box-shadow:none;background:transparent;padding:0;margin:0">` + ds.map(x => `<div class="deal-row best"><div><div class="pn" style="margin:0 0 4px">${esc(x.item.name)}</div>${mkChip(x.o.markt)} ${whenTag(x.o)}${appTag(x.o)}<div class="m">${prodTxt(x.o)}</div></div><div class="price"><b>${eur(x.o.preis)}</b>${x.o._u?`<small>${unitOnly(x.o)}</small>`:''}</div></div>`).join('') + `</div>`;
  try{ $('#popup').showModal(); }catch(e){}
  try{
    if('Notification' in window && Notification.permission === 'granted' && 'serviceWorker' in navigator){
      const reg = await navigator.serviceWorker.ready;
      reg.showNotification('Bestpreise für deine Liste', {body: lines.join('\n'), icon: 'icon-192.png', tag: 'bestpreis'});
    }
  }catch(e){}
}
$('#popupOk').onclick = () => $('#popup').close();

// ---------- Einstellungen / Push ----------
const dlg = $('#dlg');
$('#cfg').onclick = () => {
  $('#plzInfo').innerHTML = D.plz ? `<b>${esc(D.plz)}</b> · Märkte: ${esc(Object.keys(D.maerkte||{}).join(', ') || 'alle (Umkreisprüfung noch nicht gelaufen)')}` : 'Noch keine Daten geladen.';
  dlg.showModal();
};
$('#dlgClose').onclick = () => dlg.close();
dlg.addEventListener('click', e => { const b = e.target.closest('[data-copy]'); if(b){ const t = $('#'+b.dataset.copy); t.select(); try{ navigator.clipboard.writeText(t.value); b.textContent='Kopiert ✓'; }catch(err){ document.execCommand('copy'); } } });
function b64(s){ const p='='.repeat((4-s.length%4)%4), r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(r, c => c.charCodeAt(0)); }
$('#pushBtn').onclick = async () => {
  const msg = t => $('#pushMsg').textContent = t;
  if(!window.VAPID_PUBLIC_KEY) return msg('Erst VAPID_PUBLIC_KEY in docs/config.js eintragen (siehe README).');
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return msg('Push ist hier nicht verfügbar. iPhone: App zuerst zum Home-Bildschirm hinzufügen und von dort öffnen.');
  try{
    if(await Notification.requestPermission() !== 'granted') return msg('Erlaubnis wurde abgelehnt.');
    const reg = await navigator.serviceWorker.ready;
    const s = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64(window.VAPID_PUBLIC_KEY)});
    $('#subTxt').value = JSON.stringify(s);
    $('#wlTxt').value = JSON.stringify([...new Set(list.filter(i=>!i.done).map(i=>i.name))]);
    $('#pushOut').hidden = false; msg('Fertig. Beide Texte als GitHub-Secrets eintragen (README, Schritt 4).');
  }catch(e){ msg('Fehler: ' + e.message); }
};

// ---------- Start ----------
async function load(){
  try{
    D = await (await fetch('data/offers.json', {cache:'no-cache'})).json();
    D.angebote = D.angebote || [];
  }catch(e){ D = {angebote: []}; }
  const bits = [];
  if(D.demo) bits.push('Demo-Daten – noch keine echten Angebote geladen.');
  else if(D.fehler && D.fehler.length) bits.push('Teilweise Fehler beim Abruf: ' + D.fehler.slice(0,2).join('; '));
  if(D.stand && !D.demo) bits.push('Angebote vom ' + D.stand.replace('T',' ').slice(0,16));
  $('#banner').innerHTML = D.demo || (D.fehler && D.fehler.length) ? `<div class="banner">${esc(bits.join(' '))}</div>` : '';
  learnVocab(); render(); announceDeals();
}
learnVocab(); render(); load();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} }
</script>
</body>
